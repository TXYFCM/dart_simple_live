name: Windows and Android packages

on:
  workflow_dispatch:

env:
  JAVA_VERSION: "17"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS_VERSION: "35.0.0"
  ANDROID_NDK_VERSION: "28.2.13676358"

jobs:
  build-android:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-${{ env.ANDROID_API_LEVEL }}
            build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }}
            ndk;${{ env.ANDROID_NDK_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: simple_live_app/.fvmrc
          cache: true

      - name: Configure Android JDK
        run: flutter config --jdk-dir "$JAVA_HOME"

      - name: Restore packages
        working-directory: simple_live_app
        run: flutter pub get

      - name: Build APK
        working-directory: simple_live_app
        run: flutter build apk --release --split-per-abi

      - name: Upload Android APKs
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: |
            simple_live_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            simple_live_app/build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: simple_live_app/.fvmrc
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Restore packages
        working-directory: simple_live_app
        run: flutter pub get

      - name: Install flutter_distributor
        run: dart pub global activate flutter_distributor

      - name: Build Windows MSIX
        working-directory: simple_live_app
        run: flutter_distributor package --platform windows --targets msix --skip-clean

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-msix
          path: simple_live_app/build/dist/*/*.msix
          if-no-files-found: error
