name: Windows EXE installer and portable ZIP

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: build-windows-android-1.11.7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: simple_live_app/.fvmrc
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Restore packages
        working-directory: simple_live_app
        run: flutter pub get

      - name: Build Windows application
        working-directory: simple_live_app
        run: flutter build windows --release

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path "simple_live_app\build\windows\x64\runner\Release\*" -DestinationPath "simple_live_app\build\SimpleLive-1.11.7-Windows-Portable.zip" -Force

      - name: Build selectable-location EXE installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path -LiteralPath $iscc)) { throw "Inno Setup compiler not found" }
          & $iscc "simple_live_app\windows\installer.iss"

      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: windows-exe-and-portable
          path: |
            simple_live_app/build/windows/installer/*.exe
            simple_live_app/build/SimpleLive-1.11.7-Windows-Portable.zip
          if-no-files-found: error
